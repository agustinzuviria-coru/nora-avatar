<div id="enlaces"></div>
<div id="registro"></div>
<script>
/* Escucha lo que el avatar manda por la sala de LiveKit. Muestra como boton todo link que aparezca
   en el texto, y con ?debug=1 en la URL muestra el registro crudo, para saber si llega la transcripcion. */
(function () {
  var debug = /[?&]debug=1/.test(location.search);
  var reg = document.getElementById('registro');
  if (debug) reg.style.display = 'block';
  function log(tipo, txt) {
    if (!debug) return;
    var h = new Date().toLocaleTimeString('es-MX');
    reg.textContent += '[' + h + '] ' + tipo + ': ' + txt + '\n';
    reg.scrollTop = reg.scrollHeight;
  }
  var vistos = {};
  var enlaces = document.getElementById('enlaces');
  var RE = /\b((?:https?:\/\/|www\.)[^\s<>"']+|[a-z0-9-]+(?:\.[a-z0-9-]+)*\.(?:com|mx|gob\.mx|org|net)(?:\/[^\s<>"']*)?)/gi;
  function buscarLinks(texto) {
    var m; RE.lastIndex = 0;
    while ((m = RE.exec(texto))) {
      var u = m[1].replace(/[.,;:)]+$/, '');
      var href = /^https?:/i.test(u) ? u : 'https://' + u;
      if (vistos[href]) continue;
      vistos[href] = 1;
      var a = document.createElement('a');
      a.href = href; a.target = '_blank'; a.rel = 'noopener';
      a.innerHTML = '<span>Enlace que mencionó Nora</span>';
      a.appendChild(document.createTextNode(u));
      enlaces.appendChild(a);
    }
  }
  function decodificar(b) { try { return new TextDecoder().decode(b); } catch (e) { return '(binario)'; } }
  var el = document.querySelector('coru-video-agent');
  var actual = null;
  function enganchar(room) {
    log('sala', 'nueva sala, escuchando');
    room.on('dataReceived', function (payload, participante, tipo, tema) {
      var t = decodificar(payload);
      if (tema === 'latency' || /^lat/i.test(tema || '')) return;
      log('datos ' + (tema || 'sin tema'), t.slice(0, 400));
      buscarLinks(t);
    });
    room.on('transcriptionReceived', function (segmentos, participante) {
      (segmentos || []).forEach(function (s) {
        if (!s.final) return;
        log('transcripcion ' + (participante && participante.identity || ''), s.text);
        buscarLinks(s.text);
      });
    });
    ['lk.transcription', 'lk.chat'].forEach(function (tema) {
      try {
        room.registerTextStreamHandler(tema, function (reader, info) {
          reader.readAll().then(function (t) {
            log('texto ' + tema + ' ' + (info && info.identity || ''), t);
            buscarLinks(t);
          });
        });
      } catch (e) { log('aviso', 'no se pudo escuchar ' + tema + ': ' + e.message); }
    });
  }
  setInterval(function () {
    if (el.room && el.room !== actual) { actual = el.room; enganchar(actual); }
  }, 50);
})();
</script>
